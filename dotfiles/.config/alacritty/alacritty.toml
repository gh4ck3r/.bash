[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#303030"
#blue = "#4040ff"
blue = "#1e90ff"       # 뚜렷하고 밝은 도저 블루(Dodger Blue)
cyan = "#00ffff"
green = "#00ff00"
magenta = "#ffaaff"
red = "#ff0000"
white = "#ffffff"
yellow = "#ffff00"

[colors.normal]
black = "#202020"
#blue = "#0000dd"
blue = "#61afef"       # 기존 대비 가독성이 높은 원다크(One Dark) 계열의 블루
cyan = "#00dddd"
green = "#00dd00"
magenta = "#dd80dd"
red = "#dd0000"
white = "#dddddd"
yellow = "#dddd00"

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[env]
TERM = "xterm-256color"

[font]
size = 10.5

[font.bold]
family = "D2CodingLigature Nerd Font"
style = "Bold"

[font.bold_italic]
family = "D2CodingLigature Nerd Font"
style = "Bold Italic"

[font.italic]
family = "D2CodingLigature Nerd Font"
style = "Italic"

[font.normal]
family = "D2CodingLigature Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "CreateNewWindow"
key = "N"
mods = "Control|Shift"

[scrolling]
history = 100000

[window]
opacity = 0.8
